name: ci

on:
  push:
    branches:
      - prod
      - staging

env:
  REGISTRY_URL: container-registry.br-se1.magalu.cloud/your_repo
  REGISTRY_USERNAME: username
  REGISTRY_TOKEN: password
  PORTAINER_UPDATE_URL_STAGING: staging
  PORTAINER_UPDATE_URL_PROD: prod
  # DOCKER_IMAGE_PLATFORMS: linux/amd64,linux/arm64
  DOCKER_IMAGE_PLATFORMS: linux/amd64

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_TOKEN }}

      - name: Generate random tag
        id: generate_tag
        run: |
          echo "::set-output name=random_tag::random-${{ github.sha }}"
          echo "::set-output name=branch_tag::${GITHUB_REF##*/}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # target: server  # for multi-stage builds
          push: true
          # tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest
          # tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest,${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.generate_tag.outputs.random_tag }}
          tags: ${{ env.REGISTRY_URL }}/${{ github.event.repository.name }}:${{ steps.generate_tag.outputs.branch_tag }}
          platforms: ${{ env.DOCKER_IMAGE_PLATFORMS }}

      - name: Update Portainer prod
        if: steps.generate_tag.outputs.branch_tag == 'prod'
        run: |
          curl -X POST ${{ env.PORTAINER_UPDATE_URL_PROD }}

      - name: Update Portainer staging
        if: steps.generate_tag.outputs.branch_tag == 'staging'
        run: |
          curl -X POST ${{ env.PORTAINER_UPDATE_URL_STAGING }}

      # - name: SSH and update
      #   uses: cssnr/stack-deploy-action@v1
      #   with:
      #     host: ${{ secrets.DOCKER_CLUSTER_HOST }}
      #     user: ${{ secrets.DOCKER_CLUSTER_USER }}
      #     ssh_key: ${{ secrets.DOCKER_CLUSTER_SSH_PRIVATE_KEY }}
      #     file: "docker-compose.swarm.yml"
      #     name: "${{ github.event.repository.name }}" # stack name is same as repo
